<style>
  *{box-sizing:border-box;}

  tr:nth-child(even){background:#141419;} tr:nth-child(odd){background:#0f0f14;}

  .reset-btn{display:inline-block;background:#bd8a1a;color:#141419;font-size:14px;padding:8px 17px;
