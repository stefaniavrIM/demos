<!DOCTYPE html>

<head>

<title>Intro to Hacking</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:20px;
       line-height:1.5;background:#0a0a0f;color:#eae6f5;}
  .wrap{max-width:760px;margin:0 auto;padding:52px 24px;}
  h1,h2{font-family:'Courier New',monospace;}

      padding:6px 16px;margin:.2em 0 .9em;letter-spacing:1px;}
  a{color:inherit;}
  .demo{display:flex;gap:18px;align-items:center;background:#160f26;border:1px solid #3a2b5c;
        border-radius:16px;padding:22px 24px;margin:16px 0;text-decoration:none;color:inherit;
        transition:border-color .15s,transform .15s;}
  .demo:hover{border-color:#9d4edd;transform:translateY(-2px);}
  .num{font-family:'Courier New',monospace;font-weight:700;font-size:20px;color:#42ffb7;
       background:#9d4edd;border-radius:10px;padding:8px 12px;flex:none;}
  .emoji{font-size:34px;line-height:1;flex:none;}
  .demo h2{font-size:23px;margin:0;color:#fff;font-weight:700;line-height:1.3;}
  .tag{color:#42ffb7;font-size:.82em;}
  .foot{opacity:.3;font-size:13px;margin-top:2.4em;}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="hl">Intro to Hacking</h1>

  <a href="blog.html" class="demo">

    <span class="emoji">&#127859;</span>

  </a>

  <a href="club.html" class="demo">
    <span class="num">02</span>
    <span class="emoji">&#128272;</span>
